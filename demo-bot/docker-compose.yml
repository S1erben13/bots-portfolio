name: servicebot

x-app: &app
  build: .
  env_file:
    - path: .env.example
      required: true
    - path: .env
      required: false
  volumes:
    - media:/app/media
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-servicebot}
      POSTGRES_USER: ${POSTGRES_USER:-servicebot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-servicebot}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Веб: админка диспетчера + страницы QR
  web:
    <<: *app
    environment:
      RUN_MIGRATIONS: "1"
    ports:
      - "8000:8000"

  # Боты: Telegram и/или MAX (включаются при наличии токенов в .env)
  # + рассылка уведомлений о статусах из очереди (outbox).
  bot:
    <<: *app
    command: ["python", "manage.py", "run_bots"]
    environment:
      WAIT_FOR_MIGRATIONS: "1"
    depends_on:
      web:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
  media:
