services:
  app:
    build: .
    ports:
      - "127.0.0.1:8020:8000"
    env_file:
      - path: .env
        required: false
    volumes:
      - crm_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  crm_data:
