services:
  shop:
    build: .
    ports:
      - "127.0.0.1:8040:8040"
    env_file: .env
    environment:
      DB_PATH: /app/data/shop.sqlite3
      FILES_ROOT: /app/files
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
    volumes:
      - shop_data:/app/data
      - ./demo-files:/app/files:ro
    restart: unless-stopped
volumes:
  shop_data:
